<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bepari-BD — Admin</title>
    <meta name="description" content="BepariBD wholesale marketplace administration." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#14356B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1B33" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      IBM Plex Sans carries the UI; IBM Plex Mono sets machine identifiers (SKUs,
      order ids, TIN/VAT/NID). Noto Sans Bengali is last in the stack purely so
      the taka sign resolves: IBM Plex has no U+09F3, and font fallback is
      per-glyph, so ৳ picks up Noto while every Latin character stays Plex.
      Before this, ৳ fell back to an arbitrary system face mid-number.
    -->
    <!--
      Inter Tight (UI + figures) + IBM Plex Mono (identifiers only) + Noto Sans Bengali (৳).
      IBM Plex Mono is loaded at 400/500/600 only — identifiers only, never for
      long text, so the heavier cuts would be weight nobody reads.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Scrollbars are the one thing Tailwind can't token-ise cleanly, so they
         read the same custom properties index.css defines. */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border-default);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover { background-color: var(--color-border-strong); background-clip: content-box; }
      * { scrollbar-color: var(--color-border-default) transparent; scrollbar-width: thin; }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-surface-app text-text-primary antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
